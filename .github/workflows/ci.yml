name: CI — Sistema Melvin

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─── BACKEND: JUnit 5 + Mockito ───
  backend-tests:
    name: Backend Tests (JUnit 5)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        working-directory: ./sistema
        env:
          JWT_SECRET: ci-test-secret-key-256-bits-minimum-length-for-security
          FRONTEND_URL: http://localhost:3000
          STRIPE_API_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_test_placeholder
        run: ./mvnw test --batch-mode --no-transfer-progress

  # ─── FRONTEND: Lint & Build ───
  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        env:
          VITE_REACT_APP_FETCH_URL: http://localhost:8443
          VITE_STRIPE_PUBLIC_KEY: pk_test_placeholder
        run: npm run build

  # ─── FRONTEND: Playwright E2E (mock-based, sem backend) ───
  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E (build + serve + test via webServer)
        working-directory: ./frontend
        env:
          VITE_REACT_APP_FETCH_URL: http://localhost:8443
          VITE_STRIPE_PUBLIC_KEY: pk_test_placeholder
        run: npm test

  # ─── SECRET SCANNING: gitleaks nos commits novos do PR ───
  secret-scan:
    name: Secret Scanning (gitleaks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (versão fixada)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks version

      - name: Varredura dos commits do PR
        run: ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="${{ github.event.pull_request.base.sha }}..HEAD"
