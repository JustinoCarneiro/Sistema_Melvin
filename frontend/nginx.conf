server {
    listen 80;

    server_tokens off;

    # Cabeçalhos de segurança. O nginx do servidor (HTTPS) repassa estes cabeçalhos ao navegador.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # A câmera é do leitor de QR Code da retirada de cesta; o resto não é usado.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # HTTPS obrigatório por 180 dias neste domínio (sem includeSubDomains nem preload: outros subdomínios não são deste sistema).
    add_header Strict-Transport-Security "max-age=15552000" always;
    # Só as diretivas que não restringem script, estilo nem imagem. Uma política completa (script-src etc.) precisa ser
    # testada com o Stripe e as fontes reais antes de valer; ver memoria-tecnica/decisoes.
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o Backend
    location /api/ {
        proxy_pass http://backend-melvin:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evita 504 prematuro em chamadas que dependem do Stripe (criação de
        # assinatura). O default do nginx é 60s; o SDK Stripe já tem timeout
        # próprio de 20s, então 120s aqui é apenas uma rede de segurança.
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
